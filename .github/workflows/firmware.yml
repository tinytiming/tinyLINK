name: firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.2.0"
  PICOTOOL_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: waveshare_rp2040_zero
            name: rp2040-zero
          - board: pico
            name: pico
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential pkg-config \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev

      - name: Cache Pico SDK and picotool
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            pico-sdk
            picotool-install
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-picotool-${{ env.PICOTOOL_VERSION }}-ubuntu-24.04

      - name: Pico SDK and picotool
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb
          git clone --depth 1 --branch "$PICOTOOL_VERSION" https://github.com/raspberrypi/picotool.git
          cmake -S picotool -B picotool/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/picotool-install"
          cmake --build picotool/build
          cmake --install picotool/build

      - name: Build
        run: |
          cmake -S firmware -B build -G Ninja -DPICO_BOARD=${{ matrix.board }} \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -Dpicotool_DIR="$GITHUB_WORKSPACE/picotool-install/lib/cmake/picotool"
          cmake --build build
          cp build/tinylink.uf2 tinylink-${{ matrix.name }}.uf2
          cp build/tinylink.elf tinylink-${{ matrix.name }}.elf

      - uses: actions/upload-artifact@v4
        with:
          name: tinylink-${{ matrix.name }}
          path: |
            tinylink-${{ matrix.name }}.uf2
            tinylink-${{ matrix.name }}.elf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tinylink-*
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber tinylink-*.uf2
